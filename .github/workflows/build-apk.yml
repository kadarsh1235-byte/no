name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ProEditzLive-android.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        shell: bash
        run: cd ProEditzLive && sh gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee ../build.log
      - name: Show errors
        if: failure()
        run: grep -E "^e: |What went wrong|FAILED|error:|Could not" -A4 build.log | head -60
      - uses: actions/upload-artifact@v4
        with:
          name: ProEditzLive-apk
          path: ProEditzLive/app/build/outputs/apk/debug/app-debug.apk
