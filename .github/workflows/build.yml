name: Build APK From Text Archive

on:
  workflow_dispatch: # Isse manual "Run workflow" button aayega

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Revert Text file back to Zip and Extract
        run: |
          # .txt file ko wapas .zip banakar extract karne ka command
          cp ProEditzLive.txt project.zip
          unzip project.zip
          # Check karte hain ki folder extract hua ya nahi
          ls -la

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: |
          cd ProEditzLive
          chmod +x gradlew

      - name: Build with Gradle
        run: |
          cd ProEditzLive
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProEditzLive-apk
          path: ProEditzLive/app/build/outputs/apk/debug/app-debug.apk
          
