name: Build APK From Text Archive

on:
  workflow_dispatch: # Manual trigger button

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Revert Text file back to Zip and Extract
        run: |
          TEXT_FILE=$(ls *.txt | head -n 1)
          echo "Found archive file: $TEXT_FILE"
          cp "$TEXT_FILE" project.zip
          unzip project.zip
          
          # Check the extracted structure to make sure everything is present
          ls -la

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Locate gradlew and Grant Permission
        run: |
          # Find exactly where gradlew is hiding in the workspace
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found anywhere in the repository!"
            exit 1
          fi
          echo "Found gradlew at: $GRADLEW_PATH"
          chmod +x "$GRADLEW_PATH"
          
          # Save the directory path where gradlew lives for the next step
          GRADLE_DIR=$(dirname "$GRADLEW_PATH")
          echo "GRADLE_DIR=$GRADLE_DIR" >> $GITHUB_ENV

      - name: Build with Gradle
        run: |
          # Change directory to where gradlew is located and compile
          cd ${{ env.GRADLE_DIR }}
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProEditzLive-apk
          path: "**/build/outputs/apk/debug/*.apk"
          
