name: Build APK From Text Archive

on:
  workflow_dispatch: # Isse manual "Run workflow" button aayega

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Revert Text file back to Zip and Extract
        run: |
          # Kisi bhi naam ki .txt file ko dhoondh kar zip banayega
          TEXT_FILE=$(ls *.txt | head -n 1)
          echo "Found file: $TEXT_FILE"
          cp "$TEXT_FILE" project.zip
          unzip project.zip
          
          # Folder ka aslee naam dhoondhne ke liye list karein
          ls -la

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: |
          # Jis folder ke andar gradlew hai usme switch karega
          DIR_NAME=$(ls -d */ | grep -v "github" | head -n 1)
          cd "$DIR_NAME"
          chmod +x gradlew

      - name: Build with Gradle
        run: |
          DIR_NAME=$(ls -d */ | grep -v "github" | head -n 1)
          cd "$DIR_NAME"
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProEditzLive-apk
          path: "**/build/outputs/apk/debug/*.apk"
          
