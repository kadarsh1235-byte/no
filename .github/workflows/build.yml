name: Build APK From Text Archive

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Revert Text file back to Zip and Extract
        run: |
          TEXT_FILE=$(ls *.txt | head -n 1)
          cp "$TEXT_FILE" project.zip
          unzip project.zip

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Missing Gradle Wrapper
        run: |
          PROJECT_DIR=$(find . -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          cd "$PROJECT_DIR"
          gradle wrapper
          chmod +x gradlew
          echo "GRADLE_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build with Gradle (Ignore Minor Errors)
        run: |
          cd ${{ env.GRADLE_DIR }}
          # FailOnError validation ko disable karke continuous compilation enable kiya hai
          ./gradlew assembleDebug -Dlint.abortOnError=false -Dlint.checkReleaseBuilds=false --continue || echo "Trying to generate available compilation units..."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProEditzLive-apk
          path: "**/build/outputs/apk/debug/*.apk"
          
