name: Build APK From Text Archive

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Revert Text file back to Zip and Extract
        run: |
          TEXT_FILE=$(ls *.txt | head -n 1)
          echo "Found archive file: $TEXT_FILE"
          cp "$TEXT_FILE" project.zip
          unzip project.zip
          ls -la

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Missing Gradle Wrapper
        run: |
          # Jis folder me settings.gradle ya build.gradle hai wahan ja kar gradle wrapper generate karega
          PROJECT_DIR=$(find . -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          cd "$PROJECT_DIR"
          echo "Project directory found at: $PROJECT_DIR"
          
          # Fresh gradle setup generate karna
          gradle wrapper
          chmod +x gradlew
          
          # Path ko agle step ke liye save karna
          echo "GRADLE_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build with Gradle
        run: |
          cd ${{ env.GRADLE_DIR }}
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProEditzLive-apk
          path: "**/build/outputs/apk/debug/*.apk"
          
